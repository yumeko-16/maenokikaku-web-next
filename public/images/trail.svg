<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="trail_grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".9" />
      <stop offset="1" stop-color="#cfe0ff" stop-opacity="0" />
    </linearGradient>
    <filter id="trail_glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
